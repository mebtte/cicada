name: pull request checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  cli-test:
    name: CLI Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod

      - name: Run CLI tests
        run: go test ./...

  pwa-test:
    name: PWA Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pwa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check PWA
        run: npm run typecheck

      - name: Build PWA
        run: npm run build

      - name: Run PWA tests
        run: npm run test

  apple-test:
    name: Apple Test
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/apple
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run Apple tests
        run: >
          xcodebuild test
          -project Cicada.xcodeproj
          -scheme Cicada
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
